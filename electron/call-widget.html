<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>BTI Voice – Active Call</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 315px;
    height: 115px;
    overflow: hidden;
    background: transparent;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    -webkit-app-region: drag;
    user-select: none;
  }

  .widget {
    width: 315px;
    height: 115px;
    background: linear-gradient(135deg, #0f1e35 0%, #172a4a 100%);
    border: 1px solid rgba(255,255,255,0.14);
    border-radius: 13px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* ── Top bar ─────────────────────────────────── */
  .top-bar {
    display: flex;
    align-items: center;
    padding: 7px 12px 0;
    gap: 7px;
    flex-shrink: 0;
  }
  .live-pill {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    background: rgba(34,197,94,0.15);
    border: 1px solid rgba(34,197,94,0.35);
    border-radius: 20px;
    padding: 2px 7px;
    font-size: 9px;
    font-weight: 700;
    color: #4ade80;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }
  .live-dot {
    width: 5px; height: 5px;
    border-radius: 50%;
    background: #22c55e;
    box-shadow: 0 0 5px #22c55e;
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%,100% { opacity: 1; }
    50%      { opacity: 0.35; }
  }
  .hold-pill {
    display: none;
    align-items: center;
    gap: 4px;
    background: rgba(245,158,11,0.15);
    border: 1px solid rgba(245,158,11,0.35);
    border-radius: 20px;
    padding: 2px 7px;
    font-size: 9px;
    font-weight: 700;
    color: #fbbf24;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }
  .timer {
    margin-left: auto;
    font-family: 'Courier New', monospace;
    font-size: 11px;
    font-weight: 700;
    color: rgba(255,255,255,0.75);
    letter-spacing: 1px;
  }

  /* ── Main row ─────────────────────────────────── */
  .main-row {
    display: flex;
    align-items: center;
    padding: 7px 10px 7px;
    gap: 9px;
    flex: 1;
  }
  .avatar {
    width: 36px; height: 36px;
    border-radius: 50%;
    background: rgba(79,156,249,0.2);
    border: 1.5px solid rgba(79,156,249,0.35);
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; font-weight: 700; color: white;
    flex-shrink: 0;
  }
  .caller-info {
    flex: 1;
    min-width: 0;
  }
  .caller-name {
    font-size: 13px;
    font-weight: 700;
    color: #ffffff;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .caller-phone {
    font-size: 10px;
    color: rgba(255,255,255,0.45);
    margin-top: 1px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* ── Buttons ──────────────────────────────────── */
  .actions {
    display: flex;
    align-items: center;
    gap: 5px;
    flex-shrink: 0;
    -webkit-app-region: no-drag;
  }
  .btn {
    width: 30px; height: 30px;
    border-radius: 50%;
    border: none;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    background: rgba(255,255,255,0.1);
    color: white;
    flex-shrink: 0;
    transition: background 0.12s, transform 0.08s;
    -webkit-app-region: no-drag;
  }
  .btn:hover  { background: rgba(255,255,255,0.2); transform: scale(1.1); }
  .btn:active { transform: scale(0.93); }
  .btn.muted  { background: rgba(239,68,68,0.4); }
  .btn.held   { background: rgba(245,158,11,0.4); }
  .btn.end-btn {
    background: #dc2626;
    box-shadow: 0 2px 8px rgba(220,38,38,0.5);
  }
  .btn.end-btn:hover { background: #ef4444; }
  .btn.open-btn { background: rgba(79,156,249,0.18); }

  /* ── Muted banner ─────────────────────────────── */
  .muted-bar {
    display: none;
    background: rgba(239,68,68,0.15);
    border-top: 1px solid rgba(239,68,68,0.25);
    padding: 3px 0;
    text-align: center;
    font-size: 9px;
    font-weight: 700;
    color: #fca5a5;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    flex-shrink: 0;
  }
</style>
</head>
<body>

<div class="widget">

  <div class="top-bar">
    <div class="live-pill" id="livePill">
      <span class="live-dot"></span>&nbsp;ON CALL
    </div>
    <div class="hold-pill" id="holdPill">⏸ ON HOLD</div>
    <div class="timer" id="timer">0:00</div>
  </div>

  <div class="main-row">
    <div class="avatar" id="avatar">📞</div>
    <div class="caller-info">
      <div class="caller-name"  id="callerName">Active Call</div>
      <div class="caller-phone" id="callerPhone"></div>
    </div>
    <div class="actions">
      <!-- Mute -->
      <button class="btn" id="btnMute" title="Mute" onclick="handleMute()">
        <svg id="micSvg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
          <line x1="12" y1="19" x2="12" y2="23"/>
          <line x1="8" y1="23" x2="16" y2="23"/>
        </svg>
      </button>
      <!-- Hold -->
      <button class="btn" id="btnHold" title="Hold" onclick="handleHold()">
        <svg id="holdSvg" width="13" height="13" viewBox="0 0 24 24" fill="white">
          <rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>
        </svg>
      </button>
      <!-- Open main app -->
      <button class="btn open-btn" title="Open BTI Voice" onclick="handleOpen()">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
          <polyline points="15 3 21 3 21 9"/>
          <line x1="10" y1="14" x2="21" y2="3"/>
        </svg>
      </button>
      <!-- End call -->
      <button class="btn end-btn" title="End Call" onclick="handleEnd()">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="white">
          <path d="M12 9c-1.6 0-3.1.3-4.5.7v3.4c0 .4-.2.8-.5 1a11.6 11.6 0 0 1-3 1.4c-.4.1-.8 0-1.1-.3L.4 12.7A.9.9 0 0 1 .3 12c.3-2 1.3-3.8 2.7-5.2C5.5 4.3 8.6 3 12 3s6.5 1.3 9 3.8a12 12 0 0 1 2.7 5.2c.1.4 0 .8-.3 1.1l-2.5 2.5c-.3.3-.7.4-1.1.3a11.6 11.6 0 0 1-3-1.4c-.3-.2-.5-.6-.5-1V9.7C14.9 9.2 13.5 9 12 9z"/>
        </svg>
      </button>
    </div>
  </div>

  <div class="muted-bar" id="mutedBar">🔇 Microphone muted</div>
</div>

<script>
  // ── State (global so onclick handlers can access them) ────────────
  var isMuted  = false
  var isOnHold = false
  var timerID  = null
  var startMs  = null

  // ── Button handlers (must be global for onclick= to work) ─────────
  function handleMute() {
    isMuted = !isMuted
    safeAction('mute', isMuted)
    syncMuteUI()
  }
  function handleHold() {
    isOnHold = !isOnHold
    safeAction('hold', isOnHold)
    syncHoldUI()
  }
  function handleEnd() {
    safeAction('hangup', true)
    stopTimer()
  }
  function handleOpen() {
    safeAction('open', true)
  }

  function safeAction(action, value) {
    if (window.widgetAPI) window.widgetAPI.sendAction(action, value)
  }

  // ── UI sync ───────────────────────────────────────────────────────
  function syncMuteUI() {
    var btn    = document.getElementById('btnMute')
    var banner = document.getElementById('mutedBar')
    var svg    = document.getElementById('micSvg')
    if (isMuted) {
      btn.classList.add('muted')
      btn.title = 'Unmute'
      banner.style.display = 'block'
      svg.innerHTML =
        '<line x1="1" y1="1" x2="23" y2="23"/>' +
        '<path d="M9 9v3a3 3 0 0 0 5.12 2.12M15 9.34V4a3 3 0 0 0-5.94-.6"/>' +
        '<path d="M17 16.95A7 7 0 0 1 5 12v-2m14 0v2a7 7 0 0 1-.11 1.23"/>' +
        '<line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/>'
    } else {
      btn.classList.remove('muted')
      btn.title = 'Mute'
      banner.style.display = 'none'
      svg.innerHTML =
        '<path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>' +
        '<path d="M19 10v2a7 7 0 0 1-14 0v-2"/>' +
        '<line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/>'
    }
  }

  function syncHoldUI() {
    var btn      = document.getElementById('btnHold')
    var livePill = document.getElementById('livePill')
    var holdPill = document.getElementById('holdPill')
    var svg      = document.getElementById('holdSvg')
    if (isOnHold) {
      btn.classList.add('held')
      btn.title = 'Resume'
      livePill.style.display = 'none'
      holdPill.style.display = 'inline-flex'
      svg.innerHTML = '<polygon points="5 3 19 12 5 21 5 3"/>'
    } else {
      btn.classList.remove('held')
      btn.title = 'Hold'
      livePill.style.display = 'inline-flex'
      holdPill.style.display = 'none'
      svg.innerHTML = '<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>'
    }
  }

  // ── Timer ─────────────────────────────────────────────────────────
  function startTimer() {
    stopTimer()
    startMs = Date.now()
    timerID = setInterval(function() {
      var s   = Math.round((Date.now() - startMs) / 1000)
      var m   = Math.floor(s / 60)
      var sec = String(s % 60).padStart(2, '0')
      document.getElementById('timer').textContent = m + ':' + sec
    }, 1000)
  }
  function stopTimer() {
    if (timerID) { clearInterval(timerID); timerID = null }
    startMs = null
    document.getElementById('timer').textContent = '0:00'
  }

  // ── Utilities ─────────────────────────────────────────────────────
  function toInitials(str) {
    if (!str) return '📞'
    if (str.startsWith('+') || /^\d/.test(str)) return '📞'
    var words = str.trim().split(/\s+/)
    if (words.length >= 2) return (words[0][0] + words[1][0]).toUpperCase()
    return str[0].toUpperCase()
  }
  function fmtPhone(raw) {
    var d = (raw || '').replace(/\D/g, '')
    if (d.length === 11 && d[0] === '1') return '+1 (' + d.slice(1,4) + ') ' + d.slice(4,7) + '-' + d.slice(7)
    if (d.length === 10) return '(' + d.slice(0,3) + ') ' + d.slice(3,6) + '-' + d.slice(6)
    return raw
  }

  // ── Register IPC listeners once widgetAPI is available ───────────
  function registerListeners() {
    if (!window.widgetAPI) {
      // preload not loaded (e.g. dev browser preview) — show placeholder
      console.warn('[call-widget] widgetAPI unavailable')
      return
    }

    window.widgetAPI.onCallStarted(function(info) {
      var name  = info && (info.name || info.phone) ? (info.name || info.phone) : 'Active Call'
      var phone = info && info.phone ? info.phone : ''

      document.getElementById('callerName').textContent  = name
      document.getElementById('callerPhone').textContent = (name !== phone && phone) ? fmtPhone(phone) : ''
      document.getElementById('avatar').textContent      = toInitials(name)

      isMuted  = false
      isOnHold = false
      syncMuteUI()
      syncHoldUI()
      startTimer()
    })

    window.widgetAPI.onCallEnded(function() {
      stopTimer()
      document.getElementById('callerName').textContent  = 'Call ended'
      document.getElementById('callerPhone').textContent = ''
      document.getElementById('avatar').textContent      = '📞'
      isMuted  = false
      isOnHold = false
      syncMuteUI()
      syncHoldUI()
    })
  }

  // Run on DOM ready
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', registerListeners)
  } else {
    registerListeners()
  }
</script>
</body>
</html>
