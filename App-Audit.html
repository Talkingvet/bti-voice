<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>App Audit</title>
<style>
  :root {
    --bg: #0f1420; --panel: #171e2e; --panel2: #1e2739; --border: #2a3550;
    --text: #e8ecf4; --muted: #93a0b8; --accent: #4f8ef7; --accent2: #7bb0ff;
    --green: #3ecf8e; --amber: #f5b451; --red: #f36c6c;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
  a { color: var(--accent2); }

  header { display: flex; align-items: center; gap: 14px; padding: 16px 24px; border-bottom: 1px solid var(--border); background: var(--panel); position: sticky; top: 0; z-index: 10; flex-wrap: wrap; }
  header h1 { font-size: 19px; font-weight: 700; }
  header .sub { color: var(--muted); font-size: 12.5px; }
  .spacer { flex: 1; }
  .btn { background: var(--panel2); color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 8px 14px; font-size: 13px; cursor: pointer; }
  .btn:hover { border-color: var(--accent); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.danger { color: var(--red); }
  #searchBox { background: var(--panel2); border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px; color: var(--text); font-size: 13px; width: 220px; }

  .layout { display: flex; min-height: calc(100vh - 61px); }
  nav.sidebar { width: 230px; border-right: 1px solid var(--border); background: var(--panel); padding: 16px 10px; flex-shrink: 0; }
  .sidebar h2 { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); padding: 0 8px 8px; }
  .app-item { padding: 10px 12px; border-radius: 8px; cursor: pointer; font-size: 14px; margin-bottom: 4px; }
  .app-item.active { background: var(--accent); color: #fff; }
  .app-item:not(.active):hover { background: var(--panel2); }
  .app-item .app-status { display: block; font-size: 11px; color: var(--muted); margin-top: 2px; }
  .app-item.active .app-status { color: #dce9ff; }

  main { flex: 1; padding: 24px; max-width: 1050px; }
  .app-header { margin-bottom: 6px; }
  .app-header h2 { font-size: 24px; }
  .app-header .tagline { color: var(--muted); margin-top: 4px; font-size: 14px; }

  .tabs { display: flex; gap: 6px; margin: 18px 0; flex-wrap: wrap; }
  .tab { padding: 8px 14px; border-radius: 8px; font-size: 13.5px; cursor: pointer; border: 1px solid var(--border); background: var(--panel); color: var(--muted); }
  .tab.active { background: var(--panel2); color: var(--text); border-color: var(--accent); }

  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 18px 20px; margin-bottom: 16px; }
  .card h3 { font-size: 15px; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
  .card h3 .copy-btn { font-size: 11px; padding: 3px 8px; margin-left: auto; }
  .row { display: flex; gap: 14px; padding: 8px 0; border-bottom: 1px solid rgba(42,53,80,.5); font-size: 13.5px; align-items: baseline; }
  .row:last-child { border-bottom: none; }
  .row .lbl { width: 220px; flex-shrink: 0; color: var(--muted); }
  .row .val { flex: 1; white-space: pre-wrap; word-break: break-word; line-height: 1.45; }
  .row .del { display: none; }
  body.editing .row .del { display: inline-block; background: none; border: none; color: var(--red); cursor: pointer; font-size: 14px; }
  body.editing [contenteditable="true"] { outline: 1px dashed var(--accent); outline-offset: 2px; border-radius: 3px; min-width: 30px; }
  .add-row-btn { display: none; margin-top: 10px; }
  body.editing .add-row-btn { display: inline-block; }
  .chk { width: 16px; height: 16px; accent-color: var(--green); cursor: pointer; flex-shrink: 0; align-self: flex-start; margin-top: 2px; }
  .row.done .lbl, .row.done .val { opacity: .55; }
  .row.done .lbl { text-decoration: line-through; }
  .pill { display: inline-block; padding: 2px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; }
  .pill.ok { background: rgba(62,207,142,.15); color: var(--green); }
  .pill.warn { background: rgba(245,180,81,.15); color: var(--amber); }
  .pill.crit { background: rgba(243,108,108,.15); color: var(--red); }
  .hint { color: var(--muted); font-size: 12px; margin-top: 14px; line-height: 1.5; }
  mark { background: rgba(245,180,81,.4); color: inherit; border-radius: 2px; }

  @media print {
    body { background: #fff; color: #111; }
    nav.sidebar, header .btn, #searchBox, .tabs { display: none !important; }
    .card { border-color: #ccc; background: #fff; page-break-inside: avoid; }
    .section-panel { display: block !important; }
    .row .lbl { color: #555; }
  }
  @media (max-width: 760px) {
    .layout { flex-direction: column; }
    nav.sidebar { width: 100%; border-right: none; border-bottom: 1px solid var(--border); }
    .row { flex-direction: column; gap: 2px; }
    .row .lbl { width: auto; }
  }
</style>
</head>

</header>

<script>
(function () {
  var dataEl = document.getElementById('app-data');
  var DATA = JSON.parse(dataEl.textContent);
  var state = { app: 0, tab: 0, editing: false, search: '' };

  // Load any locally saved edits (browser storage) — newer than the file wins
  try {
    var saved = localStorage.getItem('bti-app-tracker');
    if (saved) {
      var parsed = JSON.parse(saved);
      // Only use browser-saved edits if they're from the same or newer file version
      if (parsed && parsed.apps && (parsed.dataVersion || 0) >= (DATA.dataVersion || 0)) DATA = parsed;
    }
  } catch (e) {}

  function esc(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function linkify(escaped) {
    return escaped.replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
  }

  function highlight(escaped, q) {
    if (!q) return escaped;
    var i = escaped.toLowerCase().indexOf(q.toLowerCase());
    if (i < 0) return escaped;
    return escaped.slice(0, i) + '<mark>' + escaped.slice(i, i + q.length) + '</mark>' + escaped.slice(i + q.length);
  }

  function statusPill(s) {
    var cls = 'ok';
    var low = String(s).toLowerCase();
    if (low.indexOf('open') >= 0 || low.indexOf('progress') >= 0 || low.indexOf('review') >= 0) cls = 'warn';
    if (low.indexOf('block') >= 0 || low.indexOf('critical') >= 0) cls = 'crit';
    return '<span class="pill ' + cls + '">' + esc(s) + '</span>';
  }

  function rowMatches(r, q) {
    q = q.toLowerCase();
    return (r.l + ' ' + r.v).toLowerCase().indexOf(q) >= 0;
  }

  function render() {
    document.getElementById('lastUpdated').textContent = 'Last updated ' + (DATA.lastUpdated || '');
    document.body.classList.toggle('editing', state.editing);
    document.getElementById('editBtn').textContent = state.editing ? 'Done Editing' : 'Edit';

    // Sidebar
    var listHtml = '';
    DATA.apps.forEach(function (app, i) {
      listHtml += '<div class="app-item' + (i === state.app ? ' active' : '') + '" data-app="' + i + '">' +
        esc(app.name) + '<span class="app-status">' + esc(app.status || '') + '</span></div>';
    });
    document.getElementById('appList').innerHTML = listHtml;

    var app = DATA.apps[state.app];
    if (!app) { document.getElementById('mainContent').innerHTML = ''; return; }
    if (state.tab >= app.sections.length) state.tab = 0;
    var q = state.search.trim();

    var html = '<div class="app-header"><h2><span data-edit="app.name" contenteditable="' + state.editing + '">' + esc(app.name) + '</span> ' + statusPill(app.status || '') + '</h2>' +
      '<div class="tagline" data-edit="app.tagline" contenteditable="' + state.editing + '">' + esc(app.tagline || '') + '</div>';
    if (state.editing) {
      html += '<div class="tagline">Status label: <span data-edit="app.status" contenteditable="true" style="color:var(--text)">' + esc(app.status || '') + '</span></div>';
    }
    html += '</div>';

    html += '<div class="tabs">';
    app.sections.forEach(function (sec, si) {
      html += '<div class="tab' + (si === state.tab && !q ? ' active' : '') + '" data-tab="' + si + '">' + esc(sec.title) + '</div>';
    });
    html += '</div>';

    app.sections.forEach(function (sec, si) {
      var show = q ? true : si === state.tab;
      if (!show) return;
      var secHtml = '';
      sec.cards.forEach(function (card, ci) {
        var rows = card.rows;
        var visible = q ? rows.filter(function (r) { return rowMatches(r, q); }) : rows;
        if (q && visible.length === 0) return;
        var checkable = rows.filter(function (r) { return typeof r.done === 'boolean'; });
        var progress = '';
        if (checkable.length) {
          var doneCount = checkable.filter(function (r) { return r.done; }).length;
          progress = ' <span class="pill ' + (doneCount === checkable.length ? 'ok' : 'warn') + '">' + doneCount + '/' + checkable.length + ' done</span>';
        }
        secHtml += '<div class="card"><h3>' + esc(card.title) + progress +
          '<button class="btn copy-btn" data-copy="' + si + ':' + ci + '">Copy</button></h3>';
        rows.forEach(function (r, ri) {
          if (q && !rowMatches(r, q)) return;
          var chk = '';
          if (typeof r.done === 'boolean') {
            chk = '<input type="checkbox" class="chk" data-chk="' + si + ':' + ci + ':' + ri + '"' + (r.done ? ' checked' : '') + '>';
          }
          secHtml += '<div class="row' + (r.done === true ? ' done' : '') + '">' + chk +
            '<div class="lbl" data-edit="row.l" data-path="' + si + ':' + ci + ':' + ri + '" contenteditable="' + state.editing + '">' + highlight(esc(r.l), q) + '</div>' +
            '<div class="val" data-edit="row.v" data-path="' + si + ':' + ci + ':' + ri + '" contenteditable="' + state.editing + '">' + linkify(highlight(esc(r.v), q)) + '</div>' +
            '<button class="del" data-delrow="' + si + ':' + ci + ':' + ri + '" title="Delete row">✕</button>' +
            '</div>';
        });
        secHtml += '<button class="btn add-row-btn" data-addrow="' + si + ':' + ci + '">+ Add row</button>';
        secHtml += '</div>';
      });
      if (secHtml) {
        html += '<div class="section-panel">' + (q ? '<h3 style="margin:10px 0;color:var(--muted);font-size:13px">' + esc(sec.title) + '</h3>' : '') + secHtml + '</div>';
      }
    });

    if (q && html.indexOf('class="card"') < 0) {
      html += '<div class="card"><p style="color:var(--muted)">No matches for "' + esc(q) + '" in this app.</p></div>';
    }

    html += '<p class="hint">Tip: click <b>Edit</b> to change any text in place, then <b>Save Changes to File</b> to download an updated copy of this tracker — replace the old App-Tracker.html with it so your edits are permanent. Edits also auto-save in this browser in the meantime. <b>Print / PDF</b> gives you a clean document to send to developers or anyone with security questions.</p>';

    document.getElementById('mainContent').innerHTML = html;
    bindEdits();
  }

  function persist() {
    try { localStorage.setItem('bti-app-tracker', JSON.stringify(DATA)); } catch (e) {}
  }

  function bindEdits() {
    var main = document.getElementById('mainContent');
    var edits = main.querySelectorAll('[contenteditable="true"]');
    for (var i = 0; i < edits.length; i++) {
      edits[i].addEventListener('blur', function () {
        var app = DATA.apps[state.app];
        var kind = this.getAttribute('data-edit');
        var txt = this.innerText.replace(/\n+$/, '');
        if (kind === 'app.name') app.name = txt;
        else if (kind === 'app.tagline') app.tagline = txt;
        else if (kind === 'app.status') app.status = txt;
        else if (kind === 'row.l' || kind === 'row.v') {
          var p = this.getAttribute('data-path').split(':');
          var row = app.sections[p[0]].cards[p[1]].rows[p[2]];
          if (kind === 'row.l') row.l = txt; else row.v = txt;
        }
        persist();
      });
    }
  }

  document.body.addEventListener('click', function (e) {
    var t = e.target;
    var appEl = t.closest ? t.closest('.app-item') : null;
    if (appEl) { state.app = +appEl.getAttribute('data-app'); state.tab = 0; render(); return; }
    if (t.classList.contains('tab')) {
      state.tab = +t.getAttribute('data-tab');
      state.search = ''; document.getElementById('searchBox').value = '';
      render(); return;
    }
    if (t.hasAttribute && t.hasAttribute('data-copy')) {
      var p = t.getAttribute('data-copy').split(':');
      var card = DATA.apps[state.app].sections[p[0]].cards[p[1]];
      var text = card.title + '\n' + card.rows.map(function (r) {
        var mark = (typeof r.done === 'boolean') ? (r.done ? '[x] ' : '[ ] ') : '';
        return mark + r.l + ': ' + r.v;
      }).join('\n');
      navigator.clipboard.writeText(text).then(function () {
        t.textContent = 'Copied!'; setTimeout(function () { t.textContent = 'Copy'; }, 1500);
      });
      return;
    }
    if (t.hasAttribute && t.hasAttribute('data-addrow')) {
      var p2 = t.getAttribute('data-addrow').split(':');
      var targetCard = DATA.apps[state.app].sections[p2[0]].cards[p2[1]];
      var isChecklist = targetCard.rows.some(function (r) { return typeof r.done === 'boolean'; });
      var newRow = { l: 'New label', v: 'New value' };
      if (isChecklist) newRow.done = false;
      targetCard.rows.push(newRow);
      persist(); render(); return;
    }
    if (t.classList.contains('chk')) {
      var p4 = t.getAttribute('data-chk').split(':');
      DATA.apps[state.app].sections[p4[0]].cards[p4[1]].rows[p4[2]].done = t.checked;
      persist(); render(); return;
    }
    if (t.hasAttribute && t.hasAttribute('data-delrow')) {
      if (!confirm('Delete this row?')) return;
      var p3 = t.getAttribute('data-delrow').split(':');
      DATA.apps[state.app].sections[p3[0]].cards[p3[1]].rows.splice(p3[2], 1);
      persist(); render(); return;
    }
  });

  document.getElementById('editBtn').addEventListener('click', function () {
    state.editing = !state.editing;
    if (!state.editing) persist();
    render();
  });

  document.getElementById('addAppBtn').addEventListener('click', function () {
    var name = prompt('Name of the new app?');
    if (!name) return;
    DATA.apps.push({
      name: name,
      tagline: 'Describe what this app does.',
      status: 'Planning',
      sections: [
        { id: 'overview', title: 'Overview', cards: [ { title: 'The Basics', rows: [ { l: 'App name', v: name }, { l: 'What it does', v: '' }, { l: 'Who uses it', v: '' }, { l: 'Platforms', v: '' } ] }, { title: 'Key Links', rows: [ { l: 'Code repository', v: '' }, { l: 'Production URL', v: '' } ] } ] },
        { id: 'stack', title: 'Tech Specs & Stack', cards: [ { title: 'Stack', rows: [ { l: 'Frontend', v: '' }, { l: 'Backend', v: '' }, { l: 'Database', v: '' }, { l: 'Hosting', v: '' } ] }, { title: 'Third-Party Services', rows: [ { l: '', v: '' } ] } ] },
        { id: 'security', title: 'Security & Compliance', cards: [ { title: 'Security Posture', rows: [ { l: 'Authentication', v: '' }, { l: 'Data in transit', v: '' }, { l: 'Data at rest', v: '' }, { l: 'What data the app holds', v: '' } ] } ] },
        { id: 'punchlist', title: 'Punchlist', cards: [ { title: 'Feature Security Punchlist', rows: [ { l: 'Authentication reviewed', v: '', done: false }, { l: 'Third-party services reviewed', v: '', done: false } ] }, { title: 'Complete Inventory', rows: [ { l: 'All libraries documented', v: '', done: false }, { l: 'All accounts & credentials listed', v: '', done: false } ] } ] },
        { id: 'roadmap', title: 'Status & Roadmap', cards: [ { title: 'Where Things Stand', rows: [ { l: 'Current status', v: '' } ] }, { title: 'Backlog', rows: [ { l: '1.', v: '' } ] } ] },
        { id: 'contacts', title: 'Contacts & Accounts', cards: [ { title: 'Who to Ask', rows: [ { l: '', v: '' } ] }, { title: 'Accounts & Services (no passwords here)', rows: [ { l: '', v: '' } ] } ] }
      ]
    });
    state.app = DATA.apps.length - 1; state.tab = 0; state.editing = true;
    persist(); render();
  });

  document.getElementById('searchBox').addEventListener('input', function () {
    state.search = this.value; render();
  });

  document.getElementById('exportBtn').addEventListener('click', function () {
    DATA.lastUpdated = new Date().toISOString().slice(0, 10);
    persist();
    var docClone = document.documentElement.cloneNode(true);
    var dataScript = docClone.querySelector('#app-data');
    dataScript.textContent = '\n' + JSON.stringify(DATA, null, 2) + '\n';
    var mainClone = docClone.querySelector('#mainContent');
    if (mainClone) mainClone.innerHTML = '';
    var listClone = docClone.querySelector('#appList');
    if (listClone) listClone.innerHTML = '';
    var body = docClone.querySelector('body');
    if (body) body.classList.remove('editing');
    var html = '<!DOCTYPE html>\n' + docClone.outerHTML;
    var blob = new Blob([html], { type: 'text/html' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'App-Audit.html';
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 2000);
    alert('Downloaded App-Audit.html with your latest edits.\n\nMove it from Downloads into your BTI Voice folder, replacing the old file, to make the changes permanent.');
  });

  render();
})();
</script>
